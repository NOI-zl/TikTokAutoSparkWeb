# Cloudflare Workers 部署配置
# 可选：如需 KV 持久化（密码/Token/Cookie/任务不因 isolate 回收丢失）：
#   1) wrangler kv namespace create STATE
#   2) 在 Cloudflare 控制台给该 Worker 添加 KV binding，名称固定为 STATE
#   3) 本地部署时取消下面 [[kv_namespaces]] 的注释并填入 id
name = "tiktok-auto-spark-web"
main = "worker/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Browser Rendering 顶层绑定（Workers 免费版每天含 10 分钟额度）
browser = { binding = "MYBROWSER", type = "browser" }

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# 本地部署时如需 KV，取消注释并填 id：
# [[kv_namespaces]]
# binding = "STATE"
# id = "你的KV_ID"
# preview_id = "你的KV_ID"

[vars]
# 定时任务按北京时间执行（UTC+8），可自行修改
TIMEZONE_OFFSET = "8"
# 手动登录时若为 true 则跳过页内校验，直接存储 Cookie
DOUYIN_SKIP_VERIFY = "false"

[triggers]
crons = ["* * * * *"]